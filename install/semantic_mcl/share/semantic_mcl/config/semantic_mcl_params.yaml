semantic_mcl_node:
  ros__parameters:
    # motion model params
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    motion_type: "differential"

    # beam model
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    sigma_hit: 0.5 # proportional to variance so that the localization is not unimodal
    lambda_short: 0.1
    z_max_val: 12.0 # range of lidar

    # particle filter params
    particle_count: 7500
    ess_threshold: 2.5
    w_slow: 0.0
    w_fast: 0.0
    alpha_slow: 0.001
    alpha_fast: 0.1

    # semantic model
    semantic_model_type: "vlm"
    landmark_json_path: "/mnt/ssd/lsgloc_ws/src/test_semantic_mcl/config/landmarks.json"
    sigma_bearing: 0.3
    sigma_range: 1.0
    use_range: false  # Zimmerman uses bearing only; set true to also gate on range
    semantic_min_confidence: 0.6  # detections below this are ignored; raise to reduce hallucination impact  